<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D0F" />

    <!-- Favicons, generated from the T10 Properties logo mark -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>T10 Properties LLC</title>
    <meta
      name="description"
      content="T10 Properties: homes built for real accessibility, plus restaurants, hotels, and venues rated 1-10 on how easy they are to navigate."
    />

    <!--
      Open Graph / Twitter card preview image. %VITE_SITE_URL% is filled in
      by Vite from .env at build time (see frontend/.env.example) so the
      image/url tags below are absolute, which social platforms require.
      Update VITE_SITE_URL to your real production domain before deploying
      -- the default points at localhost so nothing is broken in dev.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="T10 Properties LLC" />
    <meta property="og:title" content="T10 Properties LLC" />
    <meta
      property="og:description"
      content="Homes built for real accessibility, plus restaurants, hotels, and venues rated 1-10 on how easy they are to navigate."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="T10 Properties LLC" />
    <meta
      name="twitter:description"
      content="Homes built for real accessibility, plus restaurants, hotels, and venues rated 1-10 on how easy they are to navigate."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
